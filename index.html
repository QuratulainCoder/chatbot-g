<!DOCTYPE html>
<html>
<head>
    <title>Emerson Voice Chatbot</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #f7f7f7; }
        #chatbox { width: 80%; height: 400px; border: 1px solid #ccc; overflow-y: scroll; margin: 0 auto; padding: 10px; background: white; }
        #userInput { width: 60%; padding: 10px; }
        button { padding: 10px 15px; }
        .user { color: blue; }
        .bot { color: green; }
    </style>
</head>
<body>
    <h1>Emerson Admissions Voice Chatbot</h1>
    <div id="chatbox"></div><br>
    <input type="text" id="userInput" placeholder="Type or use microphone..." />
    <button onclick="sendMessage()">Send</button>
    <button onclick="startVoice()">🎤 Speak</button>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
